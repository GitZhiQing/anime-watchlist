name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Package portable
        shell: pwsh
        run: |
          $name = "anime-watchlist_${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $name -Force
          Copy-Item "src-tauri\target\release\anime-watchlist.exe" $name
          Copy-Item "src-tauri\dist" "$name\dist" -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "anime-watchlist_$tag.zip"
          $repo = "${{ github.repository }}"

          # Release notes 一律使用发版前写好的 docs/release-notes/v<tag>.md（随代码入库），
          # 不再自动生成——本地 release.mjs 已在打 tag 前强制检查，此处兜底拦截
          $notesFile = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notesFile)) {
            throw "缺少 release notes 文件：$notesFile（发版前须先按 commit 历史撰写并入库）"
          }

          gh release create $tag $zip --repo $repo --title "$tag" --notes-file $notesFile
